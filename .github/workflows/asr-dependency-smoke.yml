name: Optional ASR dependency import smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/asr-dependency-smoke.yml'

jobs:
  dependency-import:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [whisperx, funasr, combined]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade installer
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install ASR dependencies without model weights
        shell: pwsh
        run: |
          if ('${{ matrix.engine }}' -eq 'funasr') {
            # FunASR currently does not declare torch as an install requirement.
            python -m pip install --prefer-binary torch torchaudio
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m pip install --prefer-binary funasr
          } elseif ('${{ matrix.engine }}' -eq 'combined') {
            python -m pip install --prefer-binary whisperx funasr
          } else {
            python -m pip install --prefer-binary whisperx
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify PyTorch and chosen ASR imports
        shell: pwsh
        run: |
          python -c "import torch; print('torch:', torch.__version__, 'CUDA build:', torch.version.cuda, 'CUDA available:', torch.cuda.is_available())"
          if ('${{ matrix.engine }}' -ne 'funasr') {
            python -c "import whisperx; print('WhisperX import OK; load_model:', callable(whisperx.load_model))"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ('${{ matrix.engine }}' -ne 'whisperx') {
            python -c "from funasr import AutoModel; print('FunASR import OK; AutoModel:', AutoModel)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check installed dependency conflicts
        run: python -m pip check
