[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-toolkit"
version = "0.1.0"
description = "Extensible Python audio/video transcription framework (foundation only)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["transcription*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: requires explicitly configured real ASR models and test audio"]
