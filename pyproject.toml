[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-toolkit"
version = "0.1.0"
description = "Python audio/video transcription with English and Mandarin ASR adapters"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["transcription*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: requires explicitly configured real ASR models and test audio", "real_model: opt-in tiny.en CPU model smoke requiring download", "real_speech: opt-in real English/Mandarin speech CPU model acceptance"]
